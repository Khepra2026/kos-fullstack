version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: kos
      POSTGRES_USER: $
      POSTGRES_PASSWORD: $
    volumes:
      - pg:/var/lib/postgresql/data
      -./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kos"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:./backend
    environment:
      DATABASE_URL: $
      VCP_URL: http://vcp:8090
      MODEL_VER: v1.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  vcp:
    build:./vcp
    ports:
      - "8090:8090"
  frontend:
    build:./frontend
    environment:
      NEXT_PUBLIC_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pg:
