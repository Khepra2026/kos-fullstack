version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: kos
      POSTGRES_PASSWORD: kos2026
    volumes:
      - pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  vcp:
    build: ./vcp
    ports:
      - "8090:8090"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kos:kos2026@db:5432/kos
      VCP_URL: http://vcp:8090
      MODEL_VER: v1.0.0
    depends_on:
      - db
      - vcp
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg:
