# KOS Sovereign Stack — Prometheus v3
# Corrections: OBS-002 SLO/SLA/SLI + PERF-003 monitoring API
# Corrections: DEVOPS-002 alertes failed_jobs > 3

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kos-prod'
    replica: 'primary'

rule_files:
    - 'alert.rules.yml'

alerting:
  alertmanagers:
        - static_configs:
                - targets: ['kos-alertmanager:9093']

scrape_configs:
  # 1. Frontend Nginx — PERF-001 homepage 96/100
    - job_name: 'kos-frontend'
    metrics_path: '/metrics'
    static_configs:
            - targets: ['kos-frontend:8080']
    relabel_configs:
            - source_labels: [__address__]
        target_label: instance
        replacement: 'kos-frontend'

  # 2. PostgreSQL — DB-005 pg_stat_statements
    - job_name: 'postgres'
    static_configs:
            - targets: ['kos-postgres-primary:9187']

  # 3. n8n API Gateway — INFRA-001 saturation Edge Functions
    - job_name: 'n8n'
    metrics_path: '/metrics'
    static_configs:
            - targets: ['kos-api-gateway:5678']

  # 4. Redis — PERF-003 cache hit rate
    - job_name: 'redis'
    static_configs:
            - targets: ['kos-redis:9121']

  # 5. DLQ Worker — FIX-003 auto-recovery
    - job_name: 'dlq-worker'
    static_configs:
            - targets: ['kos-dlq-worker:9100']

  # 6. Node Exporter — Infra OBS-003
    - job_name: 'node'
    static_configs:
            - targets: ['node-exporter:9100']

  # 7. Traefik — INFRA-004 load balancer
    - job_name: 'traefik'
    static_configs:
            - targets: ['kos-traefik:8080']