services:

  postgres:
    image: postgres:17
    container_name: kos-postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: kos
    ports:
      - "5434:5432"
    volumes:
      - kos_postgres_local:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: kos-redis-local
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - kos_redis_local:/data


  frontend:
    build:
      context: .
      dockerfile: ./kos-frontend/Dockerfile
    container_name: kos-frontend-local
    restart: always
    ports:
      - "5173:80"


volumes:
  kos_postgres_local:
  kos_redis_local: