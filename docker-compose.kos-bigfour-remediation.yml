# ═══════════════════════════════════════════════════════════════
# KOS BIG FOUR REMEDIATION STACK — Docker Compose
# KHEPRA EXPERTS — Infrastructure Audit Correction
# Corrige : INFRA-002 (SPOF) + DEVOPS-001 (non conteneurisé) + OBS-001 (dashboard)
# 10 conteneurs : frontend, api-gateway, supabase-local, postgres, redis,
#                 prometheus, grafana, alertmanager, dlq-worker, backup-cron
# ═══════════════════════════════════════════════════════════════

version: "3.9"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  restart: unless-stopped

x-net: &net
  networks:
      - kos-bigfour-net

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Frontend React+Vite buildé + Nginx durci
  #    DEVOPS-001 : Conteneurisation complète du frontend
  #    SEC-001 à SEC-006 : Headers de sécurité
  # ─────────────────────────────────────────────────────────────
  kos-frontend:
    build:
      context: ./kos-frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_SUPABASE_URL: ${VITE_PUBLIC_SUPABASE_URL}
        VITE_PUBLIC_SUPABASE_ANON_KEY: ${VITE_PUBLIC_SUPABASE_ANON_KEY}
    container_name: kos-frontend
    <<: [*restart, *logging, *net]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./kos-frontend/ssl:/etc/nginx/ssl:ro
      - ./kos-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kos-api-gateway

  # ─────────────────────────────────────────────────────────────
  # 2. API Gateway — Rate-limit + Circuit Breaker
  #    RES-005 : Protection contre surcharge API
  # ─────────────────────────────────────────────────────────────
  kos-api-gateway:
    image: nginx:1.27-alpine
    container_name: kos-api-gateway-bigfour
    <<: [*restart, *logging, *net]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # 3. Supabase local — Redondance
  #    INFRA-002 : Élimination SPOF Supabase Cloud
  # ─────────────────────────────────────────────────────────────
  kos-supabase-kong:
    image: kong:2.8.1
    container_name: kos-supabase-kong-bigfour
    <<: [*restart, *logging, *net]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: warn

  # ─────────────────────────────────────────────────────────────
  # 4. Postgres principal + Réplication
  #    INFRA-002 : Base locale pour redondance données
  # ─────────────────────────────────────────────────────────────
  kos-postgres:
    image: supabase/postgres:15.1.0.117
    container_name: kos-postgres-bigfour
    <<: [*restart, *logging, *net]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata-bigfour:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c wal_level=replica
      -c max_wal_senders=5
      -c wal_keep_size=64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # 5. Redis — Cache + DLQ auto-recovery
  #    FIX-003 : Auto-recovery Dead Letter Queue
  # ─────────────────────────────────────────────────────────────
  kos-redis:
    image: redis:7.2-alpine
    container_name: kos-redis-bigfour
    <<: [*restart, *logging, *net]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata-bigfour:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # 6. Prometheus — Métriques
  #    OBS-003 + PERF-003 : Monitoring API + SLA
  # ─────────────────────────────────────────────────────────────
  kos-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kos-prometheus-bigfour
    <<: [*restart, *logging, *net]
    volumes:
      - ./config/prometheus/prometheus-bigfour.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata-bigfour:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  # ─────────────────────────────────────────────────────────────
  # 7. Grafana — Dashboards
  #    OBS-001 : Dashboard kos-sovereign-infra.json
  # ─────────────────────────────────────────────────────────────
  kos-grafana:
    image: grafana/grafana:11.2.0
    container_name: kos-grafana-bigfour
    <<: [*restart, *logging, *net]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-kos-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafanadata-bigfour:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - kos-prometheus

  # ─────────────────────────────────────────────────────────────
  # 8. AlertManager — Alerting Discord/Slack
  #    OBS-004 : Notifications critiques
  # ─────────────────────────────────────────────────────────────
  kos-alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: kos-alertmanager-bigfour
    <<: [*restart, *logging, *net]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

  # ─────────────────────────────────────────────────────────────
  # 9. DLQ Worker — Auto-recovery 5min
  #    FIX-003 : Retraitement automatique des jobs échoués
  # ─────────────────────────────────────────────────────────────
  kos-dlq-worker:
    build:
      context: ./dlq-worker
      dockerfile: Dockerfile
    container_name: kos-dlq-worker-bigfour
    <<: [*restart, *logging, *net]
    environment:
      SUPABASE_URL: ${VITE_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE: ${SUPABASE_SERVICE_ROLE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@kos-redis-bigfour:6379
    depends_on:
      - kos-redis
      - kos-postgres

  # ─────────────────────────────────────────────────────────────
  # 10. Backup Cron — pg_dump + test restauration trimestriel
  #     DB-002 + RES-001 : PRA/PCA
  # ─────────────────────────────────────────────────────────────
  kos-backup-cron:
    image: postgres:15-alpine
    container_name: kos-backup-cron-bigfour
    <<: [*restart, *logging, *net]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup
      - ./backup/crontab:/var/spool/cron/crontabs/root:ro
    command: crond -f -l 8
    depends_on:
      - kos-postgres

networks:
  kos-bigfour-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.78.0.0/16

volumes:
  pgdata-bigfour:
  redisdata-bigfour:
  prometheusdata-bigfour:
  grafanadata-bigfour: