# docker-compose.kos-sovereign.yml
version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=supabase-db
      - DB_POSTGRESDB_DATABASE=postgres
      - N8N_ENCRYPTION_KEY=${N8N_KEY}
      - WEBHOOK_URL=https://kos.khepraexperts.com/n8n/
    volumes: ["n8n_data:/home/node/.n8n"]

  kos-rag-service:
    build: ./services/rag
    environment:
      - PG_HNSW_EF=100
      - MODEL=llama-405b
    depends_on: [supabase-db]