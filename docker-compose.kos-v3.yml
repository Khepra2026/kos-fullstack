version: '3.9'

services:
  # ═══════════════════════════════════════════
  # 1. LLM SOUVERAIN : Llama-3.1-70B KHEPRA
  # ═══════════════════════════════════════════
  vllm:
    image: vllm/vllm-openai:latest
    container_name: kos-vllm
    restart: unless-stopped
    command: >
      --model /models/llama-3.1-70b-khepra-ft
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.95
      --max-model-len 8192
      --dtype bfloat16
      --served-model-name llama-3.1-70b-khepra-ft
      --api-key ${VLLM_API_KEY:-kos-vllm-secret-key}
      --port 8000
    volumes:
      - ./models:/models:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0,1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - kos-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ═══════════════════════════════════════════
  # 2. EMBEDDINGS + RERANK : BGE-M3 (FR/EN/PT)
  # ═══════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: kos-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_GPU=1
      - OLLAMA_MAX_LOADED_MODELS=2
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        OLLAMA_PID=$$
        echo "Waiting for Ollama server..."
        until curl -sf http://localhost:11434/ >/dev/null 2>&1; do
          sleep 2
        done
        echo "Ollama ready. Pulling models..."
        ollama pull bge-m3
        ollama pull bge-reranker-v2-m3
        echo "Models ready. Holding..."
        wait $OLLAMA_PID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - kos-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ═══════════════════════════════════════════
  # 3. REDIS : Cache + Rate Limit
  # ═══════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: kos-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - kos-net

  # ═══════════════════════════════════════════
  # 4. n8n : Routing + Automations
  # ═══════════════════════════════════════════
  n8n:
    image: n8nio/n8n:latest
    container_name: kos-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${N8N_POSTGRES_HOST}
      - DB_POSTGRESDB_PORT=${N8N_POSTGRES_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${N8N_POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://kos.khepraexperts.com/n8n/}
      - GENERIC_TIMEZONE=Africa/Dakar
      - N8N_LOG_LEVEL=warn
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kos-net

  # ═══════════════════════════════════════════
  # 5. NGINX : Reverse Proxy (exposition publique)
  # ═══════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: kos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - vllm
      - ollama
      - n8n
    networks:
      - kos-net

volumes:
  ollama_data:
  n8n_data:
  redis_data:

networks:
  kos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16