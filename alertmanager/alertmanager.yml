# ═══════════════════════════════════════════════════════════════
# KOS ALERTMANAGER — Configuration
# OBS-004 : Alerting Discord/Slack pour incidents critiques
# ═══════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m

route:
  receiver: 'discord-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'discord-webhook'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'discord-webhook'
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: 'discord-webhook'
    webhook_configs:
      - url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          follow_redirects: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']