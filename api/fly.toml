# fly.toml app configuration file generated for kos-khepra-api on 2026-08-09T11:33:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kos-khepra-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
