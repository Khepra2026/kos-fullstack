        window.__KOS_CAUGHT_ERRORS__ = caughtErrors;

          caughtErrors.push({msg:e.message||String(e.error||''),src:e.filename||'',line:e.lineno||0,col:e.colno||0,ts:Date.now()});
        });
        window.addEventListener('unhandledrejection', function(e){
          caughtErrors.push({msg:'Promise: '+(e.reason&&e.reason.message||String(e.reason||'')),src:'',line:0,col:0,ts:Date.now()});

    <!-- ════════════════════════════════════════════════════════════════════
         EMERGENCY SW NUKE v8 — Nettoie SANS recharger en boucle.
         Supprime SW, caches, IndexedDB une seule fois. Pas de reload auto.
         ════════════════════════════════════════════════════════════════════ -->
    <script>
      (function(){
        var didClean = false;
        try { didClean = sessionStorage.getItem('__kos_did_clean_v8__') === '1'; } catch(e){}
        if (didClean) return;

        console.log('☠️ KILLER MODE — Nettoyage SW (1 fois)');

        // 1. Unregister tous les Service Workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
        }

        // 2. Vider tous les caches
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }

        // 3. Nuke IndexedDB
        if (window.indexedDB && indexedDB.databases) {
          indexedDB.databases().then(function(dbs) {
            dbs.forEach(function(db) { indexedDB.deleteDatabase(db.name); });
          });
        }
        // Fallback Workbox
        ['workbox-precache-v2','workbox-precache','workbox-runtime','workbox-expansion','workbox-background-sync'].forEach(function(n){
          try { indexedDB.deleteDatabase(n); } catch(e){}
        });

        // 4. LocalStorage / SessionStorage (sauf notre flag)
        try { localStorage.clear(); } catch(e){}
        try { sessionStorage.clear(); } catch(e){}
        try { sessionStorage.setItem('__kos_did_clean_v8__', '1'); } catch(e){}

        console.log('✅ Nettoyage terminé. PAS de reload — React va monter maintenant.');
      })();
    </script>
