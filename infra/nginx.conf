user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ─── Gzip ───
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ─── Rate Limit Zones ───
    limit_req_zone $binary_remote_addr zone=vllm_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ollama_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=n8n_limit:10m rate=20r/s;

    # ═══════════════════════════════════════════
    # UPSTREAMS
    # ═══════════════════════════════════════════
    upstream vllm_backend {
        server vllm:8000;
        keepalive 32;
    }

    upstream ollama_backend {
        server ollama:11434;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 32;
    }

    # ═══════════════════════════════════════════
    # vLLM — LLM KHEPRA (API Key protected)
    # ═══════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name vllm.kos.khepraexperts.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=vllm_limit burst=20 nodelay;

            # API Key validation
            if ($http_authorization != "Bearer ${VLLM_API_KEY}") {
                return 401 '{"error":"Unauthorized"}';
            }

            proxy_pass         http://vllm_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;

            # SSE streaming support
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }
    }

    # ═══════════════════════════════════════════
    # Ollama — Embeddings + Rerank
    # ═══════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name ollama.kos.khepraexperts.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=ollama_limit burst=50 nodelay;

            # API Key validation
            if ($http_authorization != "Bearer ${OLLAMA_API_KEY}") {
                return 401 '{"error":"Unauthorized"}';
            }

            proxy_pass         http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }

    # ═══════════════════════════════════════════
    # n8n — Workflows + Webhooks
    # ═══════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name n8n.kos.khepraexperts.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=n8n_limit burst=30 nodelay;

            proxy_pass         http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            proxy_buffering     off;
        }
    }

    # ═══════════════════════════════════════════
    # HTTP → HTTPS redirect
    # ═══════════════════════════════════════════
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}