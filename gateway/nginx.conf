# ═══════════════════════════════════════════════════════════════
# KOS API GATEWAY — Nginx Configuration
# Rate-limit + Circuit Breaker + Proxy vers Supabase
# RES-005 : Protection contre surcharge API
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # ── Rate limit zones ───────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Upstream Supabase ──────────────────────────────────
  upstream supabase_rest {
    server ${SUPABASE_REST_HOST}:443;
    keepalive 32;
  }

  upstream supabase_auth {
    server ${SUPABASE_AUTH_HOST}:443;
    keepalive 16;
  }

  # ── Circuit breaker state (shared memory) ──────────────
  lua_shared_dict circuit_breaker 10m;

  server {
    listen 8080;
    server_name _;

    # ── Global rate limit ────────────────────────────────
    limit_req zone=api_global burst=50 nodelay;
    limit_conn conn_limit 20;

    # ── Health check endpoint ────────────────────────────
    location /health {
      access_log off;
      return 200 '{"status":"healthy","service":"kos-api-gateway"}';
      add_header Content-Type application/json;
    }

    # ── Auth endpoints — rate limit strict ───────────────
    location /auth/ {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass https://supabase_auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # ── REST API — Supabase ──────────────────────────────
    location /rest/ {
      proxy_pass https://supabase_rest;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 16k;
    }

    # ── Catch-all ────────────────────────────────────────
    location / {
      return 404 '{"error":"Not Found","service":"kos-api-gateway"}';
      add_header Content-Type application/json;
    }
  }
}