# KOS EMPTY TABLE CONSOLIDATION PLAN
## Bloc 5 — Classification & Consolidation · 25 Juin 2026

### OBJECTIF

Analyser les ~104 tables Supabase vides (0 enregistrement) et les classifier en 3 catégories :
- **A — CONSERVER** : Tables stratégiques nécessaires mais non peuplées
- **B — FUSIONNER** : Tables redondantes à unifier
- **C — SUPPRIMER** : Tables inutilisées sans dépendances

### RÈGLE ABSOLUE

Aucune suppression sans : backup, analyse dépendances, validation.

