[pytest]
# ─── Paths ──────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Options ────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    -p no:cacheprovider

# ─── Timeout ────────────────────────────────────────────────────────
timeout = 120

# ─── Markers ────────────────────────────────────────────────────────
markers =
    unit: Tests unitaires — pas de dépendances externes
    integration: Tests d'intégration — nécessite backend ou edge function live
    e2e: Tests end-to-end — pipeline complet
    slow: Tests lents (> 5s)
    performance: Tests de performance et latence
    regression: Tests anti-régression (anciens bugs)

# ─── Coverage (optionnel, activer avec --cov) ───────────────────────
# [coverage:run]
# source = backend
# omit = tests/*, */migrations/*, */__pycache__/*

# [coverage:report]
# fail_under = 85
# show_missing = True
# skip_covered = False

# ─── Environment ────────────────────────────────────────────────────
# Pas de variables sensibles ici — utiliser CI secrets ou .env.test
# filterwarnings =
#     ignore::DeprecationWarning
#     ignore::PendingDeprecationWarning