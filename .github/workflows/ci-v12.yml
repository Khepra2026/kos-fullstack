name: KOS RegTech - v12 FINAL BigFour GREEN
on:
  push:
    branches: [main]

jobs:
  kos-fullstack-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: kos
          POSTGRES_USER: kos
          POSTGRES_PASSWORD: kos_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run KOS Audit
        run: python auto_revision.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: kos-v12-build
          path: frontend/.next/
          if-no-files-found: warn