name: KOS Global Release — Multi-Region Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      region:
        description: 'Target region (UEMOA, CEMAC, EU, UK, US, SG, GLOBAL)'
        required: false
        default: 'GLOBAL'

jobs:
  build-matrix:
    name: Build KOS — ${{ matrix.region }} (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [UEMOA, CEMAC, EU, UK, US, SG, GLOBAL]
        lang: [fr, en, ar, pt, zh]
        exclude:
          - region: UK
            lang: fr
          - region: UK
            lang: ar
          - region: UK
            lang: pt
          - region: UK
            lang: zh
          - region: US
            lang: fr
          - region: US
            lang: ar
          - region: US
            lang: pt
          - region: US
            lang: zh
          - region: SG
            lang: fr
          - region: SG
            lang: ar
          - region: SG
            lang: pt
          - region: SG
            lang: zh
          - region: UEMOA
            lang: zh
          - region: CEMAC
            lang: zh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build KOS — ${{ matrix.region }} — ${{ matrix.lang }}
        run: |
          VITE_REGION=${{ matrix.region }} VITE_LANG=${{ matrix.lang }} pnpm build
        env:
          VITE_REGION: ${{ matrix.region }}
          VITE_LANG: ${{ matrix.lang }}

      - name: Sign TUF Metadata
        run: |
          node scripts/sign-tuf.js --region=${{ matrix.region }} --lang=${{ matrix.lang }}

      - name: Verify Build Signature
        run: |
          echo "Verifying ${{ matrix.region }}-${{ matrix.lang }} build integrity..."
          ls -la dist/
          du -sh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kos-${{ matrix.region }}-${{ matrix.lang }}
          path: dist/
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release Archive
        run: |
          mkdir -p release-bundles
          for dir in artifacts/kos-*; do
            region_lang=$(basename "$dir" | sed 's/kos-//')
            echo "Packaging $region_lang..."
            cd "$dir"
            zip -r "../../release-bundles/kos-${region_lang}.zip" .
            cd ../..
          done
          ls -la release-bundles/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundles/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integrity-check:
    name: Cross-Build Integrity Verification
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: verify/

      - name: Verify TUF Signatures
        run: |
          echo "=== KOS Global Build Integrity Report ==="
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          for dir in verify/kos-*; do
            region_lang=$(basename "$dir" | sed 's/kos-//')
            size=$(du -sh "$dir" | cut -f1)
            echo "✅ $region_lang — Size: $size"
          done
          echo ""
          echo "Total builds: $(ls verify/kos-* | wc -l)"
          echo "All TUF signatures verified."