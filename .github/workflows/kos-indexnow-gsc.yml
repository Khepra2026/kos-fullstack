name: KOS IndexNow + GSC Submit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  nuke-index:
    name: Nuke-Index — IndexNow + Google Ping
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create IndexNow key file
        run: echo "${{ secrets.INDEXNOW_KEY }}" > public/${{ secrets.INDEXNOW_KEY }}.txt

      - name: Call KOS Force-Index Edge Function
        run: |
          echo "=== KOS Force-Index — Lancement nuke-index ==="
          echo ""

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/kos-force-index" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo ""
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            TOTAL=$(echo "$BODY" | jq -r '.totalUniqueUrls // 0' 2>/dev/null)
            SUBMITTED=$(echo "$BODY" | jq -r '.indexNowSubmitted // 0' 2>/dev/null)
            FAILED=$(echo "$BODY" | jq -r '.indexNowFailed // 0' 2>/dev/null)
            GOOGLE_OK=$(echo "$BODY" | jq -r '.googleSitemapsPinged // 0' 2>/dev/null)
            GOOGLE_FAIL=$(echo "$BODY" | jq -r '.googleSitemapsFailed // 0' 2>/dev/null)
            DURATION=$(echo "$BODY" | jq -r '.durationMs // 0' 2>/dev/null)

            echo "=========================================="
            echo "  📊 Rapport Nuke-Index"
            echo "=========================================="
            echo "  🔗 URLs trouvées      : $TOTAL"
            echo "  ✅ IndexNow OK        : $SUBMITTED"
            echo "  ❌ IndexNow échec     : $FAILED"
            echo "  📡 Google ping OK     : $GOOGLE_OK"
            echo "  📡 Google ping échec  : $GOOGLE_FAIL"
            echo "  ⏱️  Durée              : ${DURATION}ms"
            echo "=========================================="

            if [ "$FAILED" -gt 0 ] || [ "$GOOGLE_FAIL" -gt 0 ]; then
              echo "⚠️  Certaines soumissions ont échoué — voir détails ci-dessus"
            else
              echo "✅ Nuke-Index terminé avec succès !"
            fi
          else
            echo "❌ Force-Index a échoué (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Ping Google — sitemapindex.xml
        if: always()
        run: |
          echo "📡 Ping Google — sitemapindex.xml"
          curl -s "https://www.google.com/ping?sitemap=https://khepraexperts.com/sitemapindex.xml"
          echo ""

      - name: Ping Bing — sitemapindex.xml
        if: always()
        run: |
          echo "📡 Ping Bing — sitemapindex.xml"
          curl -s "https://www.bing.com/ping?sitemap=https://khepraexperts.com/sitemapindex.xml"
          echo ""

  gsc-inspect:
    name: GSC URL Inspection — Pages prioritaires
    runs-on: ubuntu-latest
    needs: nuke-index
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Setup GSC Service Account
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT }}' > /tmp/gcp-sa.json

      - name: Get GSC Access Token
        id: gsc-auth
        run: |
          # Create JWT and get access token
          SA_EMAIL=$(jq -r '.client_email' /tmp/gcp-sa.json)
          SA_KEY=$(jq -r '.private_key' /tmp/gcp-sa.json)

          # Build JWT header + claim
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | tr '/+' '_-' | tr -d '=')
          NOW=$(date +%s)
          EXP=$((NOW + 3600))

          CLAIM=$(echo -n "{\"iss\":\"$SA_EMAIL\",\"scope\":\"https://www.googleapis.com/auth/webmasters\",\"aud\":\"https://oauth2.googleapis.com/token\",\"iat\":$NOW,\"exp\":$EXP}" | base64 -w0 | tr '/+' '_-' | tr -d '=')

          SIG=$(echo -n "$HEADER.$CLAIM" | openssl dgst -sha256 -sign <(echo "$SA_KEY") -binary | base64 -w0 | tr '/+' '_-' | tr -d '=')

          JWT="$HEADER.$CLAIM.$SIG"

          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$JWT" \
            | jq -r '.access_token')

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Submit priority pages to GSC URL Inspection
        run: |
          echo "=== GSC URL Inspection — Pages prioritaires ==="

          ACCESS_TOKEN="${{ steps.gsc-auth.outputs.access_token }}"

          PRIORITY_URLS=(
            "https://khepraexperts.com/"
            "https://khepraexperts.com/conformite/bceao"
            "https://khepraexperts.com/conformite/cobac"
            "https://khepraexperts.com/conformite/gafi"
            "https://khepraexperts.com/blog"
            "https://khepraexperts.com/services"
            "https://khepraexperts.com/expertises"
            "https://khepraexperts.com/kos-landing"
            "https://khepraexperts.com/regions/uemoa-cemac"
            "https://khepraexperts.com/regions/afrique-francophone"
          )

          for URL in "${PRIORITY_URLS[@]}"; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://searchconsole.googleapis.com/v1/urlInspection:inspect" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"inspectionUrl\":\"$URL\",\"siteUrl\":\"sc-domain:khepraexperts.com\"}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ GSC Inspect: $URL"
            else
              echo "⚠️  GSC Inspect ($HTTP_CODE): $URL"
            fi
            sleep 0.5
          done

          echo ""
          echo "✅ GSC URL Inspection terminé"

      - name: Cleanup SA key
        if: always()
        run: rm -f /tmp/gcp-sa.json