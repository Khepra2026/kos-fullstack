name: KOS IndexNow + GSC

on:
  push:
    branches: [main]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit sitemaps
        env:
          GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node --version
          if (Test-Path "scripts/submit-indexnow-gsc.mjs") { node scripts/submit-indexnow-gsc.mjs } else { echo "No submit script found, skipping" }
