name: KOS IndexNow + GSC

on:
  push:
    branches: [main]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          echo "Key exists: no" -replace "yes","yes (hidden)"
          # Exemple Bing/Yandex IndexNow
          curl -X POST "https://api.indexnow.org/indexnow?url=https://kos.tg/&key=&keyLocation=https://kos.tg/.txt" -v
