name: Big Four Midnight Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm run build
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
