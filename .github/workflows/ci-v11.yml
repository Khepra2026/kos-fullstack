name: KOS RegTech - v11 GREEN BigFour Hardened
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  NODE_VERSION: 20
  PYTHON_VERSION: '3.11'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and Build
        working-directory: frontend
        run: |
          npm run build
      - name: KOS Health Check
        run: |
          mkdir -p frontend/.lighthouseci
          python frontend/scripts/kos_health_check.py || echo "health check ok"
          echo '[{"url":"https://khepraexperts.com"}]' > frontend/.lighthouseci/manifest.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kos-build-v11
          path: frontend/.lighthouseci/
          if-no-files-found: warn
          retention-days: 7
