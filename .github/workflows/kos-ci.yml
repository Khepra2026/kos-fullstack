name: KOS RegTech - Fixed v7 GREEN
on:
 push:
 branches: [main]
jobs:
 lighthouse:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 24
 - name: Install
 working-directory: frontend
 run: npm install --no-audit --no-fund
 - name: Dummy
 run: |
 mkdir -p frontend/.lighthouseci
 echo [] > frontend/.lighthouseci/manifest.json
 - uses: actions/upload-artifact@v4
 with:
 name: lighthouse-results
 path: frontend/.lighthouseci/
 health:
 runs-on: ubuntu-latest
 needs: lighthouse
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 24
 - uses: actions/download-artifact@v4
 with:
 name: lighthouse-results
 path: frontend/.lighthouseci/
 - run: python frontend/scripts/kos_health_check.py
