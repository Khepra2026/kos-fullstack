name: KOS RegTech - Fixed v3
on:
 push:
 branches: [main]
jobs:
 lighthouse:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 24
 - name: Install
 working-directory: frontend
 run: npm ci || npm install
 - name: Make dir
 run: mkdir -p frontend/.lighthouseci
 - name: Run Lighthouse
 working-directory: frontend
 run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json || echo [] >.lighthouseci/manifest.json
 - name: Upload
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: lighthouse-results
 path: frontend/.lighthouseci/
 if-no-files-found: warn
 health:
 runs-on: ubuntu-latest
 needs: lighthouse
 if: always()
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 24
 - uses: actions/download-artifact@v4
 with:
 name: lighthouse-results
 path: frontend/.lighthouseci/
 - run: pip install requests
 - run: python frontend/scripts/kos_health_check.py
