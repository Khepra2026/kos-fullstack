name: Big Four SEO + Perf
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 3h GMT daily
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── JOB 1: Lighthouse CI sur site live ────────────────────────
  lhci:
    name: Lighthouse CI — Core Web Vitals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Lighthouse CI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-lhci-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lhci-

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI — KHEPRA Live URLs
        run: |
          lhci autorun \
            --config=.lighthouserc.urls.json \
            --collect.url=https://khepraexperts.com \
            --collect.url=https://khepraexperts.com/services \
            --collect.url=https://khepraexperts.com/expertises \
            --collect.url=https://khepraexperts.com/blog \
            --collect.url=https://khepraexperts.com/contact \
            --collect.url=https://khepraexperts.com/kos-landing \
            --collect.url=https://khepraexperts.com/about
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_TOKEN }}

      - name: Upload Lighthouse results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Parse LCP from all runs — Fail if > 2.5s
        run: |
          set -e
          echo "=== LCP Analysis across all Lighthouse runs ==="

          LCP_VALUES=$(jq -r '.lighthouseResult.audits["largest-contentful-paint"].numericValue // empty' .lighthouseci/*.json 2>/dev/null || true)

          if [ -z "$LCP_VALUES" ]; then
            echo "⚠️  No LCP values found — skipping gate check"
            exit 0
          fi

          FAILED=0
          for LCP in $LCP_VALUES; do
            URL=$(jq -r '.requestedUrl // "unknown"' .lighthouseci/*.json | head -1)
            echo "  📊 LCP for $URL: ${LCP}ms"

            # bc -l for float comparison
            if (( $(echo "$LCP > 2500" | bc -l) )); then
              echo "  ❌ LCP exceeds 2.5s gate!"
              FAILED=1
            else
              echo "  ✅ LCP within gate (< 2.5s)"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ BUILD FAILED: At least one URL has LCP > 2500ms"
            echo "   Target Big Four: LCP < 1500ms (strict) | Gate: LCP < 2500ms (hard fail)"
            exit 1
          fi

          echo ""
          echo "✅ All URLs pass LCP gate (< 2.5s)"

      - name: Parse Big Four metrics summary
        if: always()
        run: |
          echo "=== Big Four Core Web Vitals Summary ==="

          for FILE in .lighthouseci/*.json; do
            [ -f "$FILE" ] || continue
            URL=$(jq -r '.requestedUrl // "unknown"' "$FILE")
            LCP=$(jq -r '.lighthouseResult.audits["largest-contentful-paint"].numericValue // 0' "$FILE")
            FCP=$(jq -r '.lighthouseResult.audits["first-contentful-paint"].numericValue // 0' "$FILE")
            CLS=$(jq -r '.lighthouseResult.audits["cumulative-layout-shift"].numericValue // 0' "$FILE")
            TBT=$(jq -r '.lighthouseResult.audits["total-blocking-time"].numericValue // 0' "$FILE")
            PERF=$(jq -r '.lighthouseResult.categories.performance.score // 0' "$FILE")
            PERF_PCT=$(echo "scale=0; $PERF * 100 / 1" | bc)

            echo ""
            echo "🔍 $URL"
            echo "   Performance: ${PERF_PCT}%"
            echo "   LCP: ${LCP}ms | FCP: ${FCP}ms | CLS: $CLS | TBT: ${TBT}ms"

            # Check against Big Four thresholds
            if (( $(echo "$LCP > 1500" | bc -l) )); then echo "   ⚠️  LCP > 1.5s (Big Four target)"; fi
            if (( $(echo "$FCP > 1200" | bc -l) )); then echo "   ⚠️  FCP > 1.2s (Big Four target)"; fi
            if (( $(echo "$CLS > 0.02" | bc -l) )); then echo "   ⚠️  CLS > 0.02 (Big Four target)"; fi
            if (( $(echo "$TBT > 100" | bc -l) )); then echo "   ⚠️  TBT > 100ms (Big Four target)"; fi
          done

  # ─── JOB 2: Google Search Console — Sitemap Submit ─────────────
  gsc-submit:
    name: GSC — Submit Sitemap
    runs-on: ubuntu-latest
    needs: lhci
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Submit sitemap.xml to GSC
        run: |
          echo "=== Submitting sitemap to Google Search Console ==="

          SITE_URL="https%3A%2F%2Fkhepraexperts.com"
          SITEMAP_URL="https%3A%2F%2Fkhepraexperts.com%2Fsitemap.xml"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://searchconsole.googleapis.com/webmasters/v3/sites/${SITE_URL}/sitemaps/${SITEMAP_URL}" \
            -H "Authorization: Bearer ${{ secrets.GSC_TOKEN }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Sitemap submitted successfully"
          else
            echo "⚠️  GSC submission returned $HTTP_CODE — check token validity"
            # Don't fail the build for GSC issues
          fi

      - name: Submit sitemapindex.xml to GSC
        run: |
          SITE_URL="https%3A%2F%2Fkhepraexperts.com"
          SITEMAP_INDEX_URL="https%3A%2F%2Fkhepraexperts.com%2Fsitemapindex.xml"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://searchconsole.googleapis.com/webmasters/v3/sites/${SITE_URL}/sitemaps/${SITEMAP_INDEX_URL}" \
            -H "Authorization: Bearer ${{ secrets.GSC_TOKEN }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Sitemapindex submission HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Sitemapindex submitted successfully"
          else
            echo "⚠️  GSC sitemapindex returned $HTTP_CODE"
          fi

  # ─── JOB 3: Big Four Threshold Compliance Report ─────────────
  bigfour-report:
    name: Big Four Compliance Report
    runs-on: ubuntu-latest
    needs: lhci
    if: always()
    steps:
      - name: Download Lighthouse artifacts
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/

      - name: Generate Big Four compliance report
        run: |
          echo "# 🏛️ KHEPRA Big Four Performance Report" > bigfour-report.md
          echo "Generated: $(date -u +'%Y-%m-%d %H:%M UTC')" >> bigfour-report.md
          echo "" >> bigfour-report.md
          echo "| URL | Perf Score | LCP | FCP | CLS | TBT | Status |" >> bigfour-report.md
          echo "|-----|-----------|-----|-----|-----|-----|--------|" >> bigfour-report.md

          for FILE in .lighthouseci/*.json; do
            [ -f "$FILE" ] || continue
            URL=$(jq -r '.requestedUrl // "unknown"' "$FILE")
            LCP=$(jq -r '.lighthouseResult.audits["largest-contentful-paint"].numericValue // 0' "$FILE")
            FCP=$(jq -r '.lighthouseResult.audits["first-contentful-paint"].numericValue // 0' "$FILE")
            CLS=$(jq -r '.lighthouseResult.audits["cumulative-layout-shift"].numericValue // 0' "$FILE")
            TBT=$(jq -r '.lighthouseResult.audits["total-blocking-time"].numericValue // 0' "$FILE")
            PERF=$(jq -r '.lighthouseResult.categories.performance.score // 0' "$FILE")
            PERF_PCT=$(echo "scale=0; $PERF * 100 / 1" | bc)

            # Determine status
            STATUS="✅ PASS"
            if (( $(echo "$LCP > 1500" | bc -l) )); then STATUS="⚠️ LCP"; fi
            if (( $(echo "$FCP > 1200" | bc -l) )); then STATUS="⚠️ FCP"; fi
            if (( $(echo "$CLS > 0.02" | bc -l) )); then STATUS="⚠️ CLS"; fi
            if (( $(echo "$TBT > 100" | bc -l) )); then STATUS="⚠️ TBT"; fi
            if (( $(echo "$PERF < 0.96" | bc -l) )); then STATUS="⚠️ PERF"; fi

            echo "| \`$URL\` | ${PERF_PCT}% | ${LCP}ms | ${FCP}ms | $CLS | ${TBT}ms | $STATUS |" >> bigfour-report.md
          done

          echo "" >> bigfour-report.md
          echo "### Big Four Targets" >> bigfour-report.md
          echo "- **Performance**: ≥ 96%" >> bigfour-report.md
          echo "- **LCP**: < 1.5s (gate: < 2.5s)" >> bigfour-report.md
          echo "- **FCP**: < 1.2s" >> bigfour-report.md
          echo "- **CLS**: < 0.02" >> bigfour-report.md
          echo "- **TBT**: < 100ms" >> bigfour-report.md

          cat bigfour-report.md

      - name: Upload Big Four report
        uses: actions/upload-artifact@v4
        with:
          name: bigfour-compliance-report
          path: bigfour-report.md
          retention-days: 90

  # ─── JOB 4: KHEPRA Health Check — Headers KOS AI + SEO ───────
  health-check:
    name: KHEPRA Health Check — KOS Headers
    runs-on: ubuntu-latest
    needs: lhci
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KHEPRA Health Check
        run: |
          echo "=== KHEPRA Health Check v2.0 ==="
          chmod +x scripts/health-check.sh
          bash scripts/health-check.sh https://khepraexperts.com
        env:
          SHELL: /bin/bash