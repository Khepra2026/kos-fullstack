app = "kos-khepraexperts"
primary_region = "cdg"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"
  method = "GET"
  path = "/api/healthz"

[env]
  GIT_SHA = "61dbe830323aadb234731df64d3fe0dd9ddf7ce1"
  BUILD_TIME = "2026-08-25T11:07:53.754Z"
