app = "kos-fullstack"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[env]
  NODE_ENV = "production"
  PORT = "4000"
