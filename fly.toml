# fly.toml app configuration file generated for kos-fullstack on 2026
app = "kos-fullstack"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  NODE_ENV = "production"

[[metrics]]
  port = 4000
  path = "/metrics"
