app = "api-khepraexperts"
primary_region = "cdg"
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
