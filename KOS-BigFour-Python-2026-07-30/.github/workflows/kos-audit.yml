name: KOS Big Four - Regulatory Validation

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Chaque lundi 06h00 UTC (audit hebdo)
  workflow_dispatch:

jobs:
  regulatory-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout KOS
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (stable Big Four)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest pytest-html
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Locate validation suite
        id: locate
        run: |
          # Supporte les 2 structures
          if [ -d "03_validation_suite" ]; then echo "suite=03_validation_suite" >> $GITHUB_OUTPUT; 
          elif [ -d "KOS-BigFour-Python-2026-07-30/03_validation_suite" ]; then echo "suite=KOS-BigFour-Python-2026-07-30/03_validation_suite" >> $GITHUB_OUTPUT;
          else echo "suite=." >> $GITHUB_OUTPUT; fi

      - name: Run 44 tests - BCEAO / BALE III / IFRS9 / LBC-FT
        run: |
          mkdir -p 07_reports
          pytest ${{ steps.locate.outputs.suite }} -v --html=07_reports/audit_40_masters_FINAL.html --self-contained-html --junitxml=07_reports/junit.xml

      - name: Upload HTML report (artefact audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kos-audit-report-${{ github.run_number }}
          path: |
            07_reports/audit_40_masters_FINAL.html
            07_reports/junit.xml
            07_reports/README*.md
          retention-days: 365

      - name: Fail gate - 0 tolerance
        run: |
          # Si 1 seul test fail, le job fail -> bloque la PR
          if grep -q "failed" 07_reports/junit.xml; then
            echo "::error::REGULATORY GATE FAILED - Voir audit_40_masters_FINAL.html"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## KOS 40 Masters - Validation" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "Tests: 44 passed attendu" >> $GITHUB_STEP_SUMMARY
          echo "Rapport: 07_reports/audit_40_masters_FINAL.html" >> $GITHUB_STEP_SUMMARY
