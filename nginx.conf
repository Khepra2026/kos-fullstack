    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.supabase.co https://media.licdn.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://kos-khepraexperts.fly.dev https://api.linkedin.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

    # SEC-003 à SEC-006
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
