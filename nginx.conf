    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # KOS LinkedIn Hub - Proxy vers Supabase Edge Function
    location /api/linkedin/ {
        rewrite ^/api/linkedin/(.*) /functions/v1/kos-linkedin-hub/$1 break;
        proxy_pass https://pgfwhahiwqvqeahpirjx.supabase.co;
        proxy_set_header Host pgfwhahiwqvqeahpirjx.supabase.co;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        
        # CORS pour Vite
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, apikey, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # LinkedIn OAuth callback - garde le frontend qui gère le code
    location /linkedin-callback {
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck pour Fly
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Cache statique agressif
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /metrics {
        access_log off;
    }
