# ═══════════════════════════════════════════════════════════════
# REDIS — Event Queue & Caching
# KOS Sovereign Stack
# ═══════════════════════════════════════════════════════════════

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notifications (for pub/sub pattern used by n8n triggers)
notify-keyspace-events Ex

# Client
maxclients 10000