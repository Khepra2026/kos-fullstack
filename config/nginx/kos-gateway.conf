# ═══════════════════════════════════════════════════════════════
# KOS API GATEWAY — NGINX
# Point d'entrée unifié du KOS Sovereign Stack
# Sécurité: TLS 1.3, rate limiting, WAF rules
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  # ── Base ──────────────────────────────────────────────────
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format kos_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"rt":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_rt":$upstream_response_time,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"'
  '}';

  access_log /var/log/nginx/access.log kos_json buffer=32k flush=5s;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  server_tokens off;

  # ── Gzip ──────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml;

  # ── Rate Limiting ─────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=n8n_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  limit_req_status 429;
  limit_conn_status 429;

  # ── Upstreams ─────────────────────────────────────────────
  upstream n8n_backend {
    server n8n:5678 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }

  upstream qdrant_backend {
    server qdrant:6333 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }

  upstream ingestion_backend {
    server ingestion-service:3000 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream transform_backend {
    server transform-service:3001 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream audit_backend {
    server audit-service:3002 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream memory_backend {
    server memory-engine:3003 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream governance_backend {
    server governance-engine:3004 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream audit_universal_backend {
    server kos-audit-universal-v51:3100 max_fails=2 fail_timeout=30s;
    keepalive 8;
  }

  upstream guestpost_backend {
    server guestpost-service:3500 max_fails=2 fail_timeout=15s;
    keepalive 8;
  }

  upstream grafana_backend {
    server grafana:3000 max_fails=2 fail_timeout=15s;
    keepalive 4;
  }

  # ── HTTP → HTTPS Redirect ─────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check bypass
    location /health {
      return 200 '{"status":"ok","service":"kos-api-gateway"}';
      add_header Content-Type application/json;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS Main Server ─────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL (self-signed dev — prod uses certbot/LB)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Health ────────────────────────────────────────────
    location /health {
      limit_req zone=api_limit burst=50 nodelay;
      return 200 '{"status":"ok","service":"kos-api-gateway","version":"1.0.0"}';
      add_header Content-Type application/json;
    }

    # ── n8n Orchestrator ──────────────────────────────────
    location /n8n/ {
      limit_req zone=n8n_limit burst=10 nodelay;
      limit_conn conn_limit 20;
      rewrite ^/n8n/(.*)$ /$1 break;
      proxy_pass http://n8n_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
    }

    # ── n8n Webhook (public endpoint) ─────────────────────
    location /webhook/ {
      limit_req zone=api_limit burst=30 nodelay;
      rewrite ^/webhook/(.*)$ /webhook/$1 break;
      proxy_pass http://n8n_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # ── Qdrant Vector API ─────────────────────────────────
    location /qdrant/ {
      limit_req zone=api_limit burst=50 nodelay;
      rewrite ^/qdrant/(.*)$ /$1 break;
      proxy_pass http://qdrant_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 90s;
    }

    # ── Ingestion Service ─────────────────────────────────
    location /api/ingest/ {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/ingest/(.*)$ /$1 break;
      proxy_pass http://ingestion_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # ── Transform Service ─────────────────────────────────
    location /api/transform/ {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/transform/(.*)$ /$1 break;
      proxy_pass http://transform_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    # ── Audit Service ─────────────────────────────────────
    location /api/audit/ {
      limit_req zone=api_limit burst=30 nodelay;
      rewrite ^/api/audit/(.*)$ /$1 break;
      proxy_pass http://audit_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    # ── Memory Engine ─────────────────────────────────────
    location /api/memory/ {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/memory/(.*)$ /$1 break;
      proxy_pass http://memory_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # ── Governance Engine ─────────────────────────────────
    location /api/governance/ {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/governance/(.*)$ /$1 break;
      proxy_pass http://governance_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # ── KOS RAG / Audit Universal (alias /api/kos/rag → audit-universal) ──
    location /api/kos/audit-universal {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://audit_universal_backend/api/kos/audit-universal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    location /api/kos/rag {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://audit_universal_backend/api/kos/audit-universal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # ── KOS Guestpost Generator ─────────────────────────
    location /api/kos/generate-guestpost {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://guestpost_backend/api/kos/generate-guestpost;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    # ── Grafana Dashboards ────────────────────────────────
    location /grafana/ {
      limit_req zone=api_limit burst=15 nodelay;
      rewrite ^/grafana/(.*)$ /$1 break;
      proxy_pass http://grafana_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Default deny ──────────────────────────────────────
    location / {
      return 404 '{"error":"not_found","message":"KOS API Gateway — endpoint non reconnu"}';
      add_header Content-Type application/json;
    }
  }
}