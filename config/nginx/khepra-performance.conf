# ═══════════════════════════════════════════════════════════════════
# KHEPRA EXPERTS — Nginx Configuration Ultra-Performance
# ═══════════════════════════════════════════════════════════════════
# Implémente les recommandations Big Four pour atteindre 100/100
# sur Google PageSpeed Insights avec Core Web Vitals optimaux.
#
# CIBLES:
#   LCP  < 1.0s   (Largest Contentful Paint)
#   INP  < 100ms  (Interaction to Next Paint)
#   CLS  = 0.0    (Cumulative Layout Shift)
#   TTFB < 200ms  (Time to First Byte, depuis UEMOA/Europe)
#
# USAGE:
#   1. Placer dans /etc/nginx/sites-available/khepraexperts.com
#   2. Symlink: ln -s /etc/nginx/sites-available/khepraexperts.com /etc/nginx/sites-enabled/
#   3. Tester: nginx -t && nginx -s reload
#
# PRÉREQUIS:
#   - Module ngx_brotli (https://github.com/google/ngx_brotli)
#   - Module ngx_http_headers_module (standard)
#   - Module ngx_http_gzip_static_module (standard)
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name khepraexperts.com www.khepraexperts.com;

    # ── HTTP → HTTPS redirect ──
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khepraexperts.com www.khepraexperts.com;

    # ── SSL / TLS Big Four Standard ──
    ssl_certificate     /etc/nginx/ssl/khepraexperts.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/khepraexperts.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data      on;  # TLS 1.3 0-RTT

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    root  /var/www/khepraexperts.com/dist;
    index index.html;

    # ═════════════════════════════════════════════
    # BROTLI COMPRESSION — Niveau 5 (Big Four standard)
    # ═════════════════════════════════════════════
    # Brotli réduit le poids de 20% supplémentaires vs Gzip.
    # Priorité: Brotli > Gzip (le navigateur négocie via Accept-Encoding)
    brotli              on;
    brotli_comp_level   5;
    brotli_static       on;
    brotli_types        text/plain text/css text/javascript application/javascript
                        application/json application/xml application/rss+xml
                        image/svg+xml font/woff font/woff2 font/ttf
                        application/vnd.ms-fontobject;

    # ── Gzip fallback (navigateurs sans Brotli) ──
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types          text/plain text/css text/javascript application/javascript
                        application/json application/xml application/rss+xml
                        image/svg+xml font/woff font/woff2 font/ttf
                        application/vnd.ms-fontobject;
    gzip_static         on;
    gzip_disable        "msie6";

    # ═════════════════════════════════════════════
    # CACHE CONTROL — Agressif (Big Four Standard)
    # ═════════════════════════════════════════════

    # Assets statiques avec hash: immuable 1 an
    location /assets/ {
        expires              1y;
        add_header          Cache-Control "public, max-age=31536000, immutable";
        add_header          Vary "Accept-Encoding";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
        add_header          Access-Control-Allow-Origin "*";
        brotli_static       on;
        gzip_static         on;
        try_files           $uri =404;
    }

    # Images: cache 30 jours
    location /images/ {
        expires              30d;
        add_header          Cache-Control "public, max-age=2592000, immutable";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
        brotli_static       on;
        gzip_static         on;
        try_files           $uri =404;
    }

    # Polices: cache 1 an
    location /fonts/ {
        expires              1y;
        add_header          Cache-Control "public, max-age=31536000, immutable";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
        brotli_static       on;
        gzip_static         on;
        try_files           $uri =404;
    }

    # Service Worker: pas de cache
    location = /sw.js {
        expires              -1;
        add_header          Cache-Control "public, max-age=0, must-revalidate";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
    }

    # Sitemap: cache 1h
    location ~* \.(xml)$ {
        expires              1h;
        add_header          Cache-Control "public, max-age=3600, must-revalidate";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
        try_files           $uri =404;
    }

    # Robots.txt: cache 24h
    location = /robots.txt {
        expires              24h;
        add_header          Cache-Control "public, max-age=86400, must-revalidate";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400";
    }

    # RSS: cache 1h
    location = /rss.xml {
        expires              1h;
        add_header          Cache-Control "public, max-age=3600, must-revalidate";
        add_header          Content-Type "application/rss+xml; charset=utf-8";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
    }

    # LLMs.txt: cache 24h
    location ~* /llms(-full)?\.txt$ {
        expires              24h;
        add_header          Cache-Control "public, max-age=86400, must-revalidate";
        add_header          Content-Type "text/plain; charset=utf-8";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
    }

    # ═════════════════════════════════════════════
    # SÉCURITÉ — Headers Big Four
    # ═════════════════════════════════════════════

    # ── Anti-MIME sniffing ──
    add_header X-Content-Type-Options "nosniff" always;

    # ── Clickjacking protection ──
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── Referrer Policy ──
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Permissions Policy ──
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), usb=(), web-share=(self), window-management=(), xr-spatial-tracking=()" always;

    # ── HSTS ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── COOP / CORP / COEP ──
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # ── CSP Level 3 ──
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://assets.calendly.com https://readdy.ai https://static.readdy.ai; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://assets.calendly.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://api.calendly.com https://readdy.ai https://static.readdy.ai; frame-src 'self' https://www.google.com https://calendly.com https://*.calendly.com; frame-ancestors 'self' https://*.readdy.ai; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https://readdy.ai; upgrade-insecure-requests;" always;

    # ── Trusted Types ──
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default policy dompurify" always;

    # ── XSS Protection ──
    add_header X-XSS-Protection "0" always;

    # ═════════════════════════════════════════════
    # SPA FALLBACK — Toute route non-fichier → index.html
    # ═════════════════════════════════════════════

    location / {
        expires              -1;
        add_header          Cache-Control "public, max-age=0, must-revalidate";
        add_header          Vary "Accept-Encoding";
        add_header          Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400';
        brotli_static       on;
        gzip_static         on;
        try_files           $uri $uri/ /index.html;
    }

    # ── Bloquer l'accès aux fichiers cachés ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Bloquer les accès WordPress résiduels ──
    location ~* ^/(wp-admin|wp-content|wp-login|xmlrpc) {
        return 301 /;
    }

    # ═════════════════════════════════════════════
    # LOGGING ── Minimal (performance)
    # ═════════════════════════════════════════════
    access_log  /var/log/nginx/khepraexperts.com.access.log combined buffer=16k flush=5s;
    error_log   /var/log/nginx/khepraexperts.com.error.log warn;

    # ═════════════════════════════════════════════
    # KERNEL / TCP OPTIMIZATION
    # ═════════════════════════════════════════════
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;

    # Taille max body pour uploads
    client_max_body_size 10m;
}