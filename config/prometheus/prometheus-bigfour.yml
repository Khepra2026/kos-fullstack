# ═══════════════════════════════════════════════════════════════
# KOS BIG FOUR — Prometheus Configuration
# PERF-003 + OBS-003 : Monitoring Frontend + Postgres + DLQ
# ═══════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kos-bigfour
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'kos-alertmanager-bigfour:9093'

rule_files:
  - '/etc/prometheus/alerts/*.yml'
  - '/etc/prometheus/alert.rules.yml'

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Frontend Nginx ──────────────────────────────────────
  - job_name: 'kos-frontend'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['kos-frontend:443']
    metrics_path: /health

  # ── API Gateway ─────────────────────────────────────────
  - job_name: 'kos-api-gateway'
    static_configs:
      - targets: ['kos-api-gateway-bigfour:8080']
    metrics_path: /health

  # ── PostgreSQL Exporter ─────────────────────────────────
  - job_name: 'kos-postgres'
    static_configs:
      - targets: ['kos-postgres-bigfour:5432']

  # ── DLQ Worker ──────────────────────────────────────────
  - job_name: 'kos-dlq-worker'
    static_configs:
      - targets: ['kos-dlq-worker-bigfour:9091']
    metrics_path: /metrics