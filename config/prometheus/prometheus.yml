# ═══════════════════════════════════════════════════════════
# KOS SOVEREIGN STACK — Prometheus Configuration
# Scrapes: n8n, services, postgres, redis, nginx
# ═══════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kos-sovereign
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── API Gateway (nginx) ─────────────────────────────────
  - job_name: nginx-gateway
    static_configs:
      - targets: ['api-gateway:80']
    metrics_path: /health

  # ── n8n Orchestrator ────────────────────────────────────
  - job_name: n8n
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: /healthz

  # ── Memory Engine ───────────────────────────────────────
  - job_name: memory-engine
    static_configs:
      - targets: ['memory-engine:3003']
    metrics_path: /metrics

  # ── Governance Engine ───────────────────────────────────
  - job_name: governance-engine
    static_configs:
      - targets: ['governance-engine:3004']
    metrics_path: /metrics

  # ── Ingestion Service ───────────────────────────────────
  - job_name: ingestion-service
    static_configs:
      - targets: ['ingestion-service:3000']
    metrics_path: /metrics

  # ── Transform Service ───────────────────────────────────
  - job_name: transform-service
    static_configs:
      - targets: ['transform-service:3001']
    metrics_path: /metrics

  # ── Audit Service ───────────────────────────────────────
  - job_name: audit-service
    static_configs:
      - targets: ['audit-service:3002']
    metrics_path: /metrics

  # ── Qdrant Vector DB ────────────────────────────────────
  - job_name: qdrant
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /health

  # ── PostgreSQL Exporter ─────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres:5432']

  # ── Redis Exporter ──────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['redis:6379']