# ═══════════════════════════════════════════════════════════════
# KOS FRONTEND — Nginx Configuration Big Four
# Corrige SEC-001 à SEC-006 + COOP/COEP/CORP + Trusted Types
# + Rate-limit DEVOPS-002 + Gzip + Cache assets
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Rate limit DEVOPS-002 — 10 req/s par IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

  # ── HTTP → HTTPS redirect ──────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS Server ────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name kos.khepra.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # ── SEC-001 : HSTS (HTTP Strict Transport Security) ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── SEC-002 : CSP Niveau 3 ──
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://assets.calendly.com https://readdy.ai; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.supabase.co https://*.netlify.app https://readdy.ai; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.kos.khepra.com https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # ── SEC-003 : Anti-clickjacking ──
    add_header X-Frame-Options "DENY" always;

    # ── SEC-004 : Anti-MIME sniffing ──
    add_header X-Content-Type-Options "nosniff" always;

    # ── SEC-005 : Referrer + Permissions Policy ──
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=(), vibrate=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), browsing-topics=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(self), gamepad=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), otp-credentials=(), picture-in-picture=(), publickey-credentials-create=(self), screen-wake-lock=(), serial=(), storage-access=(), sync-xhr=(self), web-share=(), window-management=(), xr-spatial-tracking=()" always;

    # ── Cross-Origin isolation ──
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # ── SEC-006 : Trusted Types (Report-Only pour compatibilité) ──
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default kos-policy;" always;

    # ── XSS Protection legacy ──
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Cache-Control par défaut ──
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # ── Routes SPA ────────────────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;
      limit_req zone=api burst=20 nodelay;
    }

    # ── Health check ──────────────────────────────────────────
    location /health {
      access_log off;
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    # ── Assets statiques — cache long ─────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      limit_req zone=static burst=100 nodelay;
    }
  }
}