      - "kos.version=1.0"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # KOS GUESTPOST GENERATOR v1.0 — Article EEAT + Audit Big Four
  # Appel Ollama Mistral 7B → Log Supabase kos_backlinks
  # ═══════════════════════════════════════════════════════════════
  guestpost-service:
    build:
      context: ./services/guestpost
      dockerfile: Dockerfile
    container_name: kos-guestpost-generator-v10
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - GUESTPOST_PORT=3500
