# ═══════════════════════════════════════════════════════════════
# KOS SOVEREIGN STACK — Docker Compose v5.3
# KHEPRA EXPERTS — Big Four Architecture Technique
# RAG Universel 320 Sources — Quadruple Ancrage Obligatoire ISAE 3402
# KOS-MEMORY v5.1 — Auto-Apprentissage Big Four + Contrôle 4 Yeux + Bulk Load
# KOS-MEMORY-SEEDER-PY v5.3 — Crawl Hebdo Python BCEAO/COBAC/OHADA + L2/L3/L4 + Validate 4 Yeux
# KOS-ALERT v5.1 — Diff Réglementaire J-1 + Auto-Patch
# ═══════════════════════════════════════════════════════════════

version: "3.9"

networks:
  kos-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/16
  kos-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  n8n_data:
  datalake_raw:
  datalake_clean:
  datalake_governed:
  datalake_audit:
  datalake_export:
  grafana_data:
  prometheus_data:
  redis_audit_data:
  kos_memory_data:
  ollama_data:

services:
  # ─────────────────────────────────────────────────────────────
  # API GATEWAY — Point d'entrée unifié KOS
  # ─────────────────────────────────────────────────────────────
  api-gateway:
    image: nginx:1.27-alpine
    container_name: kos-api-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./config/nginx/kos-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/lua/:/etc/nginx/lua/:ro
    networks:
      - kos-internal
      - kos-external
    depends_on:
      - n8n
      - qdrant
      - ingestion-service
      - transform-service
      - audit-service
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=4096
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "kos.layer=gateway"
      - "kos.criticality=AAAA"

  # ─────────────────────────────────────────────────────────────
  # N8N — Orchestration Brain
  # ─────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.82.0
    container_name: kos-n8n-orchestrator
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n/workflows/:/backup/workflows/:ro
      - ./config/n8n/credentials/:/backup/credentials/:ro
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-kos-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_EXECUTIONS_MODE=queue
      - N8N_EXECUTIONS_DATA_PRUNE=true
      - N8N_EXECUTIONS_DATA_MAX_AGE=168
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=kos_n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-kos}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - SUPABASE_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - kos-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "kos.layer=orchestration"
      - "kos.criticality=AAAA"

  # ─────────────────────────────────────────────────────────────
  # QDRANT — Vector Intelligence Layer
  # ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: kos-qdrant-vector
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=vector-intelligence"
      - "kos.criticality=AAAA"

  # ─────────────────────────────────────────────────────────────
  # POSTGRESQL — Local Analytical Mirror
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kos-postgres-analytics
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init/:/docker-entrypoint-initdb.d/:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=kos_analytics
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kos} -d kos_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=data"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # REDIS — Event Queue & Caching
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: kos-redis-queue
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=infrastructure"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # REDIS AUDIT ISAE 3402 — Logs d'audit immuables
  # ─────────────────────────────────────────────────────────────
  redis-audit:
    image: redis:7.4-alpine
    container_name: kos-redis-audit-isae3402
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_audit_data:/data
    command: redis-server --appendonly yes --appendfsync always --maxmemory 256mb --maxmemory-policy noeviction --save "" --appenddirname /data
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.audit=ISAE3402"

  # ─────────────────────────────────────────────────────────────
  # MINIO — Object Storage Local (S3-compatible)
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: kos-minio-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-kos-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    command: server /data --console-address ":9001"
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=storage"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # INGESTION SERVICE — Acquisition données réglementaires
  # ─────────────────────────────────────────────────────────────
  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: kos-ingestion-service
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-kos-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - SUPA_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPA_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      - "kos.layer=execution"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # TRANSFORM SERVICE — Validation & normalisation
  # ─────────────────────────────────────────────────────────────
  transform-service:
    build:
      context: ./services/transform
      dockerfile: Dockerfile
    container_name: kos-transform-service
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
      - QDRANT_URL=http://qdrant:6333
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      - "kos.layer=execution"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # AUDIT SERVICE — Traçabilité & compliance
  # ─────────────────────────────────────────────────────────────
  audit-service:
    build:
      context: ./services/audit
      dockerfile: Dockerfile
    container_name: kos-audit-service
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-kos-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SUPA_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPA_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"

  # ─────────────────────────────────────────────────────────────
  # QUEUE WORKER — Traitement asynchrone générique
  # ─────────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: kos-queue-worker
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - "kos.layer=execution"
      - "kos.criticality=AA"

  # ─────────────────────────────────────────────────────────────
  # MEMORY ENGINE — Mémoire stratégique KHEPRA
  # ─────────────────────────────────────────────────────────────
  memory-engine:
    build:
      context: ./services/memory
      dockerfile: Dockerfile
    container_name: kos-memory-engine
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
      - QDRANT_URL=http://qdrant:6333
      - SUPA_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPA_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - "kos.layer=intelligence"
      - "kos.criticality=AAA"

  # ─────────────────────────────────────────────────────────────
  # GOVERNANCE ENGINE — Gouvernance & Qualité ISO 27001
  # ─────────────────────────────────────────────────────────────
  governance-engine:
    build:
      context: ./services/governance
      dockerfile: Dockerfile
    container_name: kos-governance-engine
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD}@postgres:5432/kos_analytics
      - SUPA_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPA_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - kos-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"

  # ─────────────────────────────────────────────────────────────
  # PROMETHEUS — Metrics Collection
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: kos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - kos-internal
    labels:
      - "kos.layer=observability"
      - "kos.criticality=AA"

  # ─────────────────────────────────────────────────────────────
  # GRAFANA — Dashboards & Alerts
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: kos-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-kos-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - kos-internal
    depends_on:
      prometheus:
        condition: service_started
    labels:
      - "kos.layer=observability"
      - "kos.criticality=AA"

  # ═══════════════════════════════════════════════════════════════
  # KOS MEMORY ENGINE v5.1 — Auto-Apprentissage Big Four
  # API POST /api/kos/memory/memorize — Contrôle 4 Yeux R1+R2
  # API POST /api/kos/memory/load — Chargement Bulk JSONL (v5.1)
  # GET /api/kos/memory/search — Recherche best practices
  # ═══════════════════════════════════════════════════════════════
  kos-memory-engine:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.memory
    container_name: kos-memory-engine-v51
    restart: unless-stopped
    ports:
      - "3300:3300"
    environment:
      - KOS_ENV=production
      - MEMORY_PORT=3300
      - LOG_DIR=/var/log/kos-memory
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis-audit:6379
      - MIN_R1_SCORE=100
      - MIN_R2_SCORE=90
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-memory
      - ./services/compliance-seeder/data:/app/data
      - kos_memory_data:/app/data
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3300/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=intelligence"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # KOS MEMORY SEEDER PYTHON v5.3 — Crawl Hebdo + Validation 4 Yeux
  # Playwright headless + Enrichissement L2/L3/L4 auto (Crossref/ISO)
  # KOS-VALIDATE v5.3 — Contrôle 4 Yeux Big Four L1-L4 post-seed
  # 0 LLM — Regex pure — SHA256 déduplication — ISAE 3402
  # Cron: Tous les lundis 02:00 GMT (seed) + 03:00 GMT (validate)
  # ═══════════════════════════════════════════════════════════════
  kos-memory-seeder-py:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.seeder-py
    container_name: kos-memory-seeder-py-v53
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - LOG_DIR=/var/log/kos-memory-seeder
      - REDIS_URL=redis://redis-audit:6379
      - RUN_ONCE=false
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/data:/app/data
      - ./services/compliance-seeder/logs:/var/log/kos-memory-seeder
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.version=5.3"
      - "kos.audit=ISAE3402"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ═══════════════════════════════════════════════════════════════
  # KOS UNIVERSAL CRAWLER v5.2 — Puppeteer + BullMQ
  # 320 Sources — Proxy Rotation — robots.txt — ISAE 3402
  # Scale: docker-compose up -d --scale kos-crawler-worker=5
  # ═══════════════════════════════════════════════════════════════
  redis-crawler:
    image: redis:7.4-alpine
    container_name: kos-redis-crawler
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - kos-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=infrastructure"
      - "kos.criticality=AAA"

  kos-universal-crawler:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.crawler
    container_name: kos-universal-crawler-v52
    restart: unless-stopped
    ports:
      - "3400:3400"
    environment:
      - KOS_ENV=production
      - CRAWLER_PORT=3400
      - REDIS_URL=redis://redis:6379
      - REDIS_CRAWLER_URL=redis://redis-crawler:6379
      - LOG_DIR=/var/log/kos-crawler
      - DATA_DIR=/app/data
      - PROXY_LIST=${KOS_PROXY_LIST:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_ENV=${PINECONE_ENV:-us-east-1}
      - PINECONE_INDEX=${PINECONE_INDEX:-kos-rag-universal}
      - MAX_RETRIES=3
      - RATE_LIMIT_MS=5000
      - CRAWL_TIMEOUT_MS=45000
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-crawler
      - ./services/compliance-seeder/data:/app/data
    networks:
      - kos-internal
    depends_on:
      redis-crawler:
        condition: service_healthy
      redis-audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3400/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "kos.layer=execution"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # KOS COMPLIANCE SEEDER v5.2 — RAG Universel 320 Sources
  # Cron 01:00 GMT + Diff J-1 01:30 GMT + Health Check 5min + ISAE 3402
  # ═══════════════════════════════════════════════════════════════
  compliance-seeder:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile
    container_name: kos-compliance-seeder-v52
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - SUPABASE_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis-audit:6379
      - MEMORY_ENGINE_URL=http://kos-memory-engine:3300
      - LOG_DIR=/var/log/kos-seeder
      - DATA_DIR=/app/data
      - HEALTH_CHECK_INTERVAL=5
      - ISAE3402_ALERT_THRESHOLD=85
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-seeder
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
      kos-memory-engine:
        condition: service_healthy
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"

  # ═══════════════════════════════════════════════════════════════
  # AUDIT UNIVERSAL v5.1 — RAG Query Engine 320 Sources
  # API POST /api/kos/audit-universal + Blocage Quadruple Ancrage strict
  # ═══════════════════════════════════════════════════════════════
  audit-universal:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.audit
    container_name: kos-audit-universal-v51
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - KOS_ENV=production
      - AUDIT_PORT=3100
      - SUPABASE_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis-audit:6379
      - MEMORY_ENGINE_URL=http://kos-memory-engine:3300
      - LOG_DIR=/var/log/kos-audit
      - MIN_PUBLICATION_DATE=2020-01-01
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-audit
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
      kos-memory-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # KOS-ALERT CONFIG API v5.1 — Configuration des Alertes RAG
  # ═══════════════════════════════════════════════════════════════
  kos-alert-config:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.alert
    container_name: kos-alert-config-v51
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - KOS_ENV=production
      - ALERT_CONFIG_PORT=3200
      - LOG_DIR=/var/log/kos-alert
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis-audit:6379
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-alert
      - ./services/compliance-seeder/data:/app/data
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"
      - "kos.audit=ISAE3402"
    command: ["node", "alert-config.js"]

  # ═══════════════════════════════════════════════════════════════
  # KOS-ALERT WORKER v5.1 — Scan 15min + Alertes Email + Diff J-1
  # Veille automatique : 200 universités QS + 50 revues pro + 45 régulateurs + 25 normalisateurs
  # Cron 15min → Match keywords → Resend email → Diff réglementaire → Auto-patch
  # ═══════════════════════════════════════════════════════════════
  kos-alert-worker:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.alert
    container_name: kos-alert-worker-v51
    restart: unless-stopped
    environment:
      - KOS_ENV=production
      - SUPABASE_URL=${VITE_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_CONFIG_URL=http://kos-alert-config:3200
      - MEMORY_ENGINE_URL=http://kos-memory-engine:3300
      - LOG_DIR=/var/log/kos-alert
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis-audit:6379
      - SCAN_INTERVAL_MIN=15
      - TZ=GMT
    volumes:
      - ./services/compliance-seeder/logs:/var/log/kos-alert
      - ./services/compliance-seeder/data:/app/data
    networks:
      - kos-internal
    depends_on:
      redis-audit:
        condition: service_healthy
      kos-alert-config:
        condition: service_healthy
      kos-memory-engine:
        condition: service_healthy
    labels:
      - "kos.layer=compliance"
      - "kos.criticality=AAAA"
      - "kos.version=5.2"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # OLLAMA — LLM Local Engine (Mistral 7B Guestpost)
  # ═══════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: kos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/Modelfile:ro
    networks:
      - kos-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          devices:
            - capabilities: [gpu]
    labels:
      - "kos.layer=intelligence"
      - "kos.criticality=AAA"

  # ═══════════════════════════════════════════════════════════════
  # KOS EMBEDDER + RAG v2.0 — Embedding 100% Local + RAG Pipeline
  # Sentence-Transformers all-MiniLM-L6-v2 → Vector(384) → pgvector → Ollama Mistral 7B
  # 0 API Externe — ISAE 3402 — SHA256 Traçabilité
  # Endpoints: POST /embed | POST /rag | GET /health
  # ═══════════════════════════════════════════════════════════════
  kos-embedder:
    build:
      context: ./services/kos-embedder
      dockerfile: Dockerfile
    container_name: kos-embedder-rag-v20
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - MAX_BATCH_SIZE=64
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=kos-bigfour
      - RAG_TOP_K=5
      - DB_POOL_MIN=2
      - DB_POOL_MAX=10
      - TZ=GMT
    networks:
      - kos-internal
    depends_on:
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    labels:
      - "kos.layer=intelligence"
      - "kos.criticality=AAAA"
      - "kos.version=2.0"
      - "kos.audit=ISAE3402"

  # ═══════════════════════════════════════════════════════════════
  # KOS KB DOCS SEEDER v1.0 — Seed BCEAO PDFs + Big Four Best Practices
  # psycopg2 direct Supabase — PyMuPDF extraction — SHA256 déduplication
  # ═══════════════════════════════════════════════════════════════
  kos-kb-docs-seeder:
    build:
      context: ./services/compliance-seeder
      dockerfile: Dockerfile.kb-seeder
    container_name: kos-kb-docs-seeder-v10
    restart: "no"
    environment:
